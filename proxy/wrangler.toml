# Proxy de l'app d'orientation (Cloudflare Workers, offre gratuite).
# Secrets : JAMAIS ici. Les renseigner une fois avec : npx wrangler secret put LBA_TOKEN
name = "orientation-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Aucun journal des requêtes (ni commune, ni coordonnées, ni paramètres) : observabilité et logs désactivés.
logpush = false
[observability]
enabled = false

[vars]
# Origines autorisées (CORS), séparées par des virgules. Remplacer par l'adresse GitHub Pages de l'app.
ALLOWED_ORIGINS = "https://brunopeiffer.github.io,http://localhost:5181"

# Limite de débit par adresse IP : 300 recherches par minute. Un lycée sort souvent sur Internet avec une seule IP :
# une classe entière doit pouvoir chercher en même temps. Au-delà de la limite de La bonne alternance (60 appels/min),
# le proxy répond « indisponible » et l'app passe en mode dégradé (liens préremplis).
[[ratelimits]]
name = "LIMITEUR"
namespace_id = "1001"
simple = { limit = 300, period = 60 }
