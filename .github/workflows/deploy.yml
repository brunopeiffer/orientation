# Tests, détection de secrets, puis publication sur GitHub Pages à chaque push sur main.
# Pré-requis (une fois) : Settings > Pages > Source = « GitHub Actions ».
name: Tester et déployer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: python3 -I -m unittest discover etl
        working-directory: .
      - run: npm ci && npm test && npm run check
        working-directory: proxy
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Adresse PUBLIQUE du proxy (Settings > Secrets and variables > Actions > Variables > PROXY_URL).
      # Vide = l'app fonctionne en mode dégradé (liens préremplis vers La bonne alternance).
      - run: npm run build
        env:
          VITE_PROXY_URL: ${{ vars.PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: app/dist }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [secrets, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
